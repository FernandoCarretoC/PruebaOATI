@if (open) {
  <div class="dialog-backdrop" (click)="onCancel()">
    <div class="dialog" role="dialog" (click)="$event.stopPropagation()">
      <p>{{ message }}</p>
      <div class="dialog-actions">
        <button type="button" class="btn-secondary" (click)="onCancel()">
          {{ cancelLabel }}
        </button>
        <button type="button" class="btn-danger" (click)="onConfirm()">
          {{ confirmLabel }}
        </button>
      </div>
    </div>
  </div>
}
